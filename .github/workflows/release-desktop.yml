name: Release Desktop

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean
      include_macos:
        description: 'Also build macOS Apple Silicon artifacts (Windows-only by default)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-preflight:
    runs-on: windows-latest
    name: Release quality preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install root dependencies
        run: bun install

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install

      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install

      - name: Run non-live release preflight
        run: bun run quality:gate --mode pr

      - name: Upload release quality gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-gate
          path: |
            artifacts/quality-runs/
            artifacts/coverage/
          if-no-files-found: error
          retention-days: 14
  build:
    needs: quality-preflight
    strategy:
      fail-fast: false
      # tauri-action merges the current job's updater entry into the existing
      # latest.json asset. Keep release jobs serial so concurrent uploads cannot
      # read the same stale manifest and overwrite another platform entry.
      max-parallel: 1
      # Tag releases are Windows-only. A manually dispatched release may opt in
      # to the second macOS matrix entry; do not use matrix in jobs.<id>.if,
      # because GitHub evaluates that condition before expanding the matrix.
      matrix: >-
        ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.include_macos) && '{"include":[{"platform":"windows-latest","rust_target":"x86_64-pc-windows-msvc","tauri_args":"--bundles nsis","label":"Windows-x64","asset_name_pattern":"Claude-Code-Haha_[version]_windows_x64_[bundle][ext]"},{"platform":"macos-latest","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin --bundles app,dmg","label":"macOS-ARM64","asset_name_pattern":"Claude-Code-Jiangxia_[version]_macos_arm64_[bundle][ext]","apple_signing_identity":"-"}]}' || '{"include":[{"platform":"windows-latest","rust_target":"x86_64-pc-windows-msvc","tauri_args":"--bundles nsis","label":"Windows-x64","asset_name_pattern":"Claude-Code-Haha_[version]_windows_x64_[bundle][ext]"}]}') }}

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' desktop/src-tauri/tauri.conf.json)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches version
        if: github.event_name == 'push'
        shell: bash
        run: |
          EXPECTED_TAG="v${{ steps.version.outputs.value }}"
          if [ "${GITHUB_REF_NAME}" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version ${EXPECTED_TAG}"
            exit 1
          fi

      - name: Load release notes
        id: release_notes
        shell: bash
        run: |
          NOTES_FILE="release-notes/v${{ steps.version.outputs.value }}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Missing release notes file: $NOTES_FILE"
            exit 1
          fi

          {
            echo 'body<<__RELEASE_NOTES__'
            cat "$NOTES_FILE"
            echo
            echo '__RELEASE_NOTES__'
          } >> "$GITHUB_OUTPUT"

      # ── System dependencies (Linux) ──────────────────────────
      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      # ── Bun ──────────────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Node.js (for tauri-action compatibility) ─────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Rust ─────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
          shared-key: ${{ matrix.rust_target }}

      # ── Install dependencies ─────────────────────────────────
      - name: Install root dependencies
        run: bun install

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install

      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install

      # ── Build sidecars ───────────────────────────────────────
      - name: Build sidecars
        working-directory: desktop
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.rust_target }}
        run: bun run build:sidecars

      - name: Audit staged Windows workflow pack resources
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p artifacts/release
          bun run scripts/audit-workflow-packs.ts --resource-dir desktop/src-tauri/binaries --layer windows-release-resource --output-file artifacts/release/workflow-pack-staged-audit.json


      # ── Build Tauri app ──────────────────────────────────────
      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for desktop updater artifacts"
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.rust_target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          projectPath: desktop
          tauriScript: bun run tauri:audited
          tagName: v__VERSION__
          releaseName: 'Claude Code Jiangxia v__VERSION__'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: ${{ matrix.asset_name_pattern }}
          args: ${{ matrix.tauri_args }} --ci --config src-tauri/tauri.release-ci.json

      - name: Upload workflow pack audits
        if: always() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: workflow-pack-audit-${{ matrix.label }}
          path: |
            artifacts/release/workflow-pack-staged-audit.json
            artifacts/release/workflow-pack-audit.json
          if-no-files-found: error
          retention-days: 30
